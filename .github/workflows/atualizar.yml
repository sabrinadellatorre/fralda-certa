name: Atualizar precos
on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_dispatch:
  push:
    paths:
      - "produtos.json"
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consultar precos
        run: node scripts/atualizar.mjs
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      - name: Salvar precos
        run: git add -N docs/diagnostico.json; git diff --quiet docs/ || (git config user.name robo-precos && git config user.email robo-precos@users.noreply.github.com && git add docs/dados.json docs/diagnostico.json && git commit -m "Precos atualizados" && git push)
